<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ban-Koe Academy | Progress</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="progress.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>Ban-Koe Academy</h1>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <p class="nav-group-title">Main</p>
                <button onclick="goDashboard()">🏠 Dashboard</button>
                <button onclick="goTraining()">📖 Training</button>
                <button onclick="goQuiz()">📝 Quiz</button>
            </div>

            <div class="nav-group">
                <p class="nav-group-title">Library</p>
                <button onclick="goProducts()">📦 Products</button>
            </div>

            <div class="nav-group">
                <p class="nav-group-title">Tools</p>
                <button class="active" onclick="goProgress()">📈 Progress</button>
                <button onclick="goSettings()">⚙ Settings</button>
            </div>
        </nav>

        <div class="sidebar-footer">Version 1.0</div>
    </aside>

    <main class="content">
        <header class="page-header">
            <h1 class="pageTitle">PROGRESS</h1>
            <p class="page-subtitle">Track your growth across Ban-Koe Academy.</p>
        </header>

        <div class="toolbar">
            <button class="btn" onclick="goTraining()">Resume Training</button>
            <button class="btn btn-primary" onclick="goQuiz()">Go to Quiz</button>
        </div>

        <section class="progress-dashboard">
            <section class="stats-grid">
                <article class="card metric-card">
                    <p class="metric-label">Accuracy</p>
                    <h3 id="accuracyValue">0%</h3>
                </article>
                <article class="card metric-card">
                    <p class="metric-label">Questions Answered</p>
                    <h3 id="questionsValue">0</h3>
                </article>
                <article class="card metric-card">
                    <p class="metric-label">Quizzes Completed</p>
                    <h3 id="quizzesValue">0</h3>
                </article>
                <article class="card metric-card">
                    <p class="metric-label">XP Earned</p>
                    <h3 id="xpValue">0 XP</h3>
                </article>
            </section>

            <article class="card streak-card">
                <div class="card-heading">
                    <p class="section-eyebrow">Current Streak</p>
                    <h2>🔥 <span id="streakValue">0</span></h2>
                </div>
                <p class="card-support">Correct answers in a row</p>
            </article>

            <section class="card section-card">
                <div class="card-heading">
                    <p class="section-eyebrow">Skill Mastery</p>
                    <h2>SKILL MASTERY</h2>
                </div>
                <div id="skillMasteryList" class="skill-list"></div>
            </section>

            <div class="dashboard-grid">
                <section class="card section-card">
                    <div class="card-heading">
                        <p class="section-eyebrow">Achievements</p>
                        <h2>ACHIEVEMENTS</h2>
                    </div>
                    <div id="achievementList" class="achievement-list"></div>
                </section>
            </div>
        </section>
    </main>
</div>

<script src="../scripts/navigation.js"></script>
<script src="../data/module1.js"></script>
<script src="../data/module2.js"></script>
<script src="../data/edwards/index.js"></script>
<script src="../data/wiringQuestions.js"></script>
<script src="../data/partNumberQuestions.js"></script>
<script src="../data/accessControlQuestions.js"></script>
<script src="../data/quizData.js"></script>
<script src="progress.js"></script>
</body>
</html>

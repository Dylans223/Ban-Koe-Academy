<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ban-Koe Academy | Progress</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="progress.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>Ban-Koe Academy</h1>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <p class="nav-group-title">Main</p>
                <button onclick="goDashboard()">🏠 Dashboard</button>
                <button onclick="goTraining()">📖 Training</button>
                <button onclick="goQuiz()">📝 Quiz</button>
            </div>

            <div class="nav-group">
                <p class="nav-group-title">Library</p>
                <button onclick="goProducts()">📦 Products</button>
            </div>

            <div class="nav-group">
                <p class="nav-group-title">Tools</p>
                <button class="active" onclick="goProgress()">📈 Progress</button>
                <button onclick="goSettings()">⚙ Settings</button>
            </div>
        </nav>

        <div class="sidebar-footer">Version 1.0</div>
    </aside>

    <main class="content">
        <header class="page-header">
            <h1 class="pageTitle">Progress</h1>
            <p class="page-subtitle">Track performance metrics and completion quality across training sessions.</p>
        </header>

        <div class="toolbar">
            <button class="btn" onclick="goTraining()">Resume Training</button>
            <button class="btn" onclick="goQuiz()">Run Quiz</button>
        </div>

        <section class="statsGrid">
            <article class="card">
                <h2>XP</h2>
                <h1 id="xpCounter">0</h1>
            </article>

            <article class="card">
                <h2>Level</h2>
                <h1 id="levelCounter">1</h1>
            </article>

            <article class="card">
                <h2>Rank</h2>
                <h1 id="rankCounter">Apprentice</h1>
            </article>

            <article class="card">
                <h2>Accuracy</h2>
                <h1 id="accuracyCounter">0%</h1>
            </article>

            <article class="card">
                <h2>Correct</h2>
                <h1 id="correctCounter">0</h1>
            </article>

            <article class="card">
                <h2>Incorrect</h2>
                <h1 id="incorrectCounter">0</h1>
            </article>

            <article class="card">
                <h2>Questions Answered</h2>
                <h1 id="questionsCounter">0</h1>
            </article>

            <article class="card">
                <h2>Session Status</h2>
                <h1>Active</h1>
            </article>
        </section>
    </main>
</div>

<script src="../scripts/navigation.js"></script>
<script src="progress.js"></script>
</body>
</html>
